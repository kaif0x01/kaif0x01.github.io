<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Account Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .popup-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        
        .apple-header {
            background-color: #f5f5f7;
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid #e1e1e6;
        }
        
        .apple-logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 15px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 600;
        }
        
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #86868b;
            line-height: 1.4;
            margin-bottom: 5px;
        }
        
        .form-container {
            padding: 25px 30px 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            color: #1d1d1f;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        input[type="email"]:focus {
            outline: none;
            border-color: #0071e3;
        }
        
        .forgot-password {
            display: block;
            text-align: center;
            color: #0071e3;
            text-decoration: none;
            font-size: 14px;
            margin-top: 15px;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        
        button {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cancel-btn {
            background-color: transparent;
            border: 1px solid #d2d2d7;
            color: #1d1d1f;
        }
        
        .cancel-btn:hover {
            background-color: #f5f5f7;
        }
        
        .signin-btn {
            background-color: #0071e3;
            border: 1px solid #0071e3;
            color: white;
        }
        
        .signin-btn:hover {
            background-color: #0077ed;
        }
        
        .signin-btn:disabled {
            background-color: #c7c7c7;
            border-color: #c7c7c7;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #d70015;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #30d158;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        
        @media (max-width: 480px) {
            .popup-container {
                max-width: 100%;
            }
            
            .form-container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="apple-header">
            <div class="apple-logo"></div>
            <h1>Sign in to your Apple Account</h1>
            <p class="subtitle">Sign in to Apple Media Services using your Apple Account.</p>
            <p class="subtitle">Don't have an account? You can create one for free.</p>
        </div>
        
        <div class="form-container">
            <form id="signin-form">
                <div class="form-group">
                    <label for="email">Apple ID</label>
                    <input type="email" id="email" placeholder="kair2k17@gmail.com" required>
                    <div class="error-message" id="email-error">Please enter a valid Apple ID.</div>
                </div>
                
                <a href="#" class="forgot-password">Forgot password?</a>
                
                <div class="button-group">
                    <button type="button" class="cancel-btn" id="cancel-btn">Cancel</button>
                    <button type="submit" class="signin-btn" id="signin-btn">Sign In</button>
                </div>
                
                <div class="success-message" id="success-message">Sign in successful! Redirecting...</div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('signin-form');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('email-error');
            const cancelBtn = document.getElementById('cancel-btn');
            const signinBtn = document.getElementById('signin-btn');
            const successMessage = document.getElementById('success-message');
            
            // Email validation function
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
            
            // Validate email on input
            emailInput.addEventListener('input', function() {
                if (isValidEmail(emailInput.value)) {
                    emailError.style.display = 'none';
                    emailInput.style.borderColor = '#d2d2d7';
                } else {
                    emailError.style.display = 'block';
                    emailInput.style.borderColor = '#d70015';
                }
            });
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!isValidEmail(emailInput.value)) {
                    emailError.style.display = 'block';
                    emailInput.style.borderColor = '#d70015';
                    emailInput.focus();
                    return;
                }
                
                // Simulate sign in process
                signinBtn.disabled = true;
                signinBtn.textContent = 'Signing In...';
                
                // Simulate API call delay
                setTimeout(function() {
                    successMessage.style.display = 'block';
                    
                    // Simulate redirect after successful sign in
                    setTimeout(function() {
                        alert('Sign in successful for: ' + emailInput.value);
                        // In a real app, you would redirect to the dashboard here
                        // window.location.href = '/dashboard';
                    }, 1500);
                }, 1500);
            });
            
            // Cancel button
            cancelBtn.addEventListener('click', function() {
                if (confirm('Are you sure you want to cancel?')) {
                    // In a real app, you would close the popup or redirect
                    alert('Sign in cancelled');
                }
            });
            
            // Forgot password link
            document.querySelector('.forgot-password').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Password reset instructions would be sent to your email.');
            });
        });
    </script>
</body>
</html>
